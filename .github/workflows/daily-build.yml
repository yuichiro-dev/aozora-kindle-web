name: Daily Build Index & Dependencies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies
        run: npm update

      - name: Run build-index.js
        run: npm run build-index

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # books.json に加えて、パッケージのロックファイル等の変更も対象にする
          git add public/books.json package.json package-lock.json 
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update books.json and dependencies via GitHub Actions" && git push)
