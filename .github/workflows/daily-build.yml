name: Daily Build Index & Deploy to Vercel

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies
        run: npm update

      - name: Run build-index.js
        run: npm run build-index

      - name: Deploy directly to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Cleanup old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # 対象プロジェクトの全デプロイをJSONで取得
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100")

          # 取得できたか確認
          if [ "$(echo "$RESPONSE" | jq -r '.deployments | length')" = "0" ] || [ -z "$(echo "$RESPONSE" | jq -r '.deployments')" ]; then
            echo "No deployments found or API error:"
            echo "$RESPONSE"
            exit 0
          fi

          # 最新1件(created降順の先頭)のuidだけ残す
          KEEP_UID=$(echo "$RESPONSE" | jq -r '.deployments | sort_by(-.created) | .[0].uid')
          echo "Keeping latest deployment: $KEEP_UID"

          # それ以外を全部削除
          echo "$RESPONSE" | jq -r '.deployments[].uid' | while read -r uid; do
            if [ "$uid" != "$KEEP_UID" ]; then
              echo "Deleting deployment: $uid"
              curl -s -X DELETE \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$uid?teamId=$VERCEL_ORG_ID"
              echo ""
            fi
          done