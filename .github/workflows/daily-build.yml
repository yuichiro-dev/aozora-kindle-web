name: Daily Build Index & Deploy to Vercel

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies
        run: npm update

      - name: Run build-index.js
        run: npm run build-index

      - name: Deploy directly to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Cleanup old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eo pipefail

          # VERCEL_ORG_ID が team_ で始まらない(=個人アカウント)場合、
          # teamId を付けるとAPIがプロジェクトを見つけられず失敗するので付けない
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            TEAM_QS="&teamId=$VERCEL_ORG_ID"
          else
            TEAM_QS=""
          fi

          URL="https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=100$TEAM_QS"

          # HTTPステータスとボディを分けて取得(-w でステータスコードを末尾に付与)
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" "$URL")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')

          echo "GET $URL -> HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ API error response:"
            echo "$RESPONSE"
            exit 1
          fi

          DEPLOY_COUNT=$(echo "$RESPONSE" | jq -r '.deployments | length')
          echo "Found $DEPLOY_COUNT deployment(s)"

          if [ "$DEPLOY_COUNT" -le 1 ]; then
            echo "Nothing to clean up."
            exit 0
          fi

          # 最新1件(created降順の先頭)のuidだけ残す
          KEEP_UID=$(echo "$RESPONSE" | jq -r '.deployments | sort_by(-.created) | .[0].uid')
          echo "Keeping latest deployment: $KEEP_UID"

          # それ以外を全部削除
          echo "$RESPONSE" | jq -r '.deployments[].uid' | while read -r uid; do
            if [ "$uid" != "$KEEP_UID" ]; then
              echo "Deleting deployment: $uid"
              DEL_STATUS=$(curl -s -o /tmp/del_resp.json -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/$uid?$([[ -n "$TEAM_QS" ]] && echo "teamId=$VERCEL_ORG_ID")")
              if [ "$DEL_STATUS" != "200" ] && [ "$DEL_STATUS" != "204" ]; then
                echo "  -> ❌ failed (HTTP $DEL_STATUS): $(cat /tmp/del_resp.json)"
              else
                echo "  -> ✅ deleted"
              fi
            fi
          done