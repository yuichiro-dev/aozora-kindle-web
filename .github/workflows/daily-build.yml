name: Daily Build Index & Deploy to Vercel

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies
        run: npm update

      - name: Run build-index.js
        run: npm run build-index

      - name: Deploy directly to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Cleanup old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # 過去のデプロイ一覧から最新1件を除いてIDを取得し、一括削除する
          DEPLOYMENTS=$(npx vercel ls --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID | grep -E 'https://' | awk '{print $1}' | tail -n +2)
          if [ -n "$DEPLOYMENTS" ]; then
            echo "$DEPLOYMENTS" | xargs -I {} npx vercel rm {} -y --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID || true
          fi